<!DOCTYPE html>
<html lang="en-us">
  <head>
    <base href="https://cdn.jsdelivr.net/gh/BopMooCow23/ut-upload-2@main/">
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0" />
    <link rel="icon" type="image/png" href="favicon.png">
    <title>UNDERTALE</title>
    <style>
      @-webkit-keyframes rotation { from { -webkit-transform: rotate(0deg); } to { -webkit-transform: rotate(360deg); } }
      @-moz-keyframes rotation { from { -moz-transform: rotate(0deg); } to { -moz-transform: rotate(360deg); } }
      @-o-keyframes rotation { from { -o-transform: rotate(0deg); } to { -o-transform: rotate(360deg); } }
      @keyframes rotation { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

      html { background: #FFFFFF; }

      body {
        font-family: arial;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        min-height: -webkit-fill-available;
        min-height: 100vh; /* Otherwise contents can be covered by an address bar in Safari on iOS 15 */
        min-width: 100vw;
        background-color: black;
        display: flex;
        flex-direction: column;
        overflow-x: hidden;
        place-items: center;
      }

      body.scrollingDisabled { overflow: hidden; }

      .emscripten { padding-right: 0; display: block; }

      div.emscripten {
        text-align: center;
        font-family: "Lucida Console", Monaco, monospace;
      }

      /* the canvas *must not* have any border or padding, or mouse coords will be wrong */
      canvas.emscripten {
        display: none;
        background-color: black;
        position: flex;
        transition: opacity 5s ease-in;
        -webkit-transition: opacity 5s ease-in;
        opacity: 0;
        filter: blur(0) grayscale(0);
        image-rendering: optimizeSpeed;
        image-rendering: -moz-crisp-edges;
        image-rendering: -webkit-optimize-contrast;
        image-rendering: -o-crisp-edges;
        image-rendering: pixelated;
        -ms-interpolation-mode: nearest-neighbor;
      }

      canvas.active { animation-name: fadeIn; animation-duration: 2s; opacity: 1; }
      canvas.paused { animation-name: blur; animation-duration: 0.5s; filter: blur(2px) grayscale(1); }
      canvas.unpaused { animation-name: none; }
      canvas.animatedSizeTransitions { transition: width 0.3s ease, height 0.3s ease; }

      @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
      @keyframes blur {
        0% { filter: blur(0) grayscale(0); }
        100% { filter: blur(2px) grayscale(1); }
      }

      .spinner {
        height: 30px;
        width: 30px;
        -webkit-animation: rotation 0.8s linear infinite;
        -moz-animation: rotation 0.8s linear infinite;
        -o-animation: rotation 0.8s linear infinite;
        animation: rotation 0.8s linear infinite;
        border: 5px solid #bdff00;
        border-top: 5px solid #719900;
        border-radius: 100%;
      }

      #status {
        display: inline-block;
        vertical-align: top;
        font-weight: bold;
        color: white;
        max-width: 90vw;
        word-break: break-word;
      }

      #status.error { color: #ff6b6b; }

      #progress {
        width: 250px;
        height: 10px;
        -webkit-appearance: none;
        appearance: none;
        padding: 5px;
      }

      progress[value]::-webkit-progress-bar {
        background-color: #8492a6;
        height: 10px;
        border-radius: 15px;
      }
      progress[value]::-webkit-progress-value {
        background-image: -webkit-linear-gradient(left, #719900, #bdff00);
        height: 10px;
        border-radius: 15px;
      }

      div.loading {
        position: absolute;
        top: 0; bottom: 0; left: 0; right: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        pointer-events: none;
      }
      div.loading > * { padding: 10px; margin: 10px; }

      .output-container { text-align: center; margin-top: auto; }
      .output-button {
        border: none;
        width: 200px;
        height: 25px;
        margin: 5px;
        border-radius: 5px;
        cursor: pointer;
        background-color: black;
        color: white;
        outline-color: #20c20e;
        outline-style: dashed;
        font-family: "Lucida Console", Monaco, monospace;
      }

      #output {
        display: none;
        height: 200px;
        background-color: black;
        color: white;
        font-family: "Lucida Console", Monaco, monospace;
        outline: none;
        border: none;
        padding: 0;
        width: 100%;
      }

      #message-container {
        display: none;
        min-height: 50px;
        background-color: rgba(20, 20, 20, 0.5);
        outline: none;
        border: none;
        padding: 0;
        width: 100%;
        position: absolute;
        top: 0;
      }

      #messages {
        margin-left: 50px;
        color: white;
        font-family: "Lucida Console", Monaco, monospace;
        outline: none;
        border: none;
        padding: 0;
      }

      img.qrCode { opacity: 1.0; width: 50%; height: 50%; }

      #pauseMenuContainer {
        position: absolute;
        top: 0; bottom: 0; left: 0; right: 0;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      #pauseMenuContainer[hidden] { display: none !important; opacity: 0; }

      #pauseMenuBorder {
        background: linear-gradient(135deg, #FA1E4E, transparent 40%);
        padding: 1px;
        border-radius: 4px;
        clip-path: polygon(10.5px 0, 100% 0, 100% 100%, 0 100%, 0 10.5px);
        width: 70vw;
        max-width: 400px;
      }

      #pauseMenu {
        display: flex;
        flex-direction: column;
        padding: 60px 30px 60px 30px;
        background: linear-gradient(180deg, #2E273F 16.15%, rgba(46, 39, 63, 0.79) 56.25%, #2E273F 91.15%);
        border-radius: 4px;
        clip-path: polygon(10px 0, 100% 0, 100% 100%, 0 100%, 0 10px);
        animation-name: fadeIn;
        animation-duration: 0.5s;
        opacity: 1;
      }

      #pauseMenu button {
        font-weight: 500;
        font-size: 17px;
        color: white;
        background: #FA1E4E;
        border: 1px solid #FA1E4E;
        border-radius: 6px;
        padding: 12px 24px;
        margin: 5px 0;
        -webkit-user-select: none;
        user-select: none;
      }

      #pauseMenu button#quitButton { background: #FA1E4E40; }
      #pauseMenu button:hover { filter: brightness(1.15); }
      #pauseMenu button:active { filter: brightness(0.85); }
      #pauseMenu button[hidden] { display: none; }
    </style>
  </head>
  <body>
    <canvas
      class="emscripten"
      id="canvas"
      oncontextmenu="event.preventDefault()"
      tabindex="-1"
    ></canvas>

    <div id="pauseMenuContainer" hidden>
      <div id="pauseMenuBorder">
        <div id="pauseMenu">
          <button id="resumeButton" onclick="resume()">Resume</button>
          <button id="quitButton" onclick="quitIfSupported()">Quit</button>
        </div>
      </div>
    </div>

    <div class="loading">
      <div class="spinner" id="spinner"></div>
      <div class="emscripten" id="status">Starting...</div>
      <progress value="0" max="100" id="progress" hidden="1"></progress>
    </div>

    <div id="message-container">
      <div id="messages"></div>
    </div>

    <!-- FIX: this element was missing from the pasted file. The tick worker below
         reads its text content, and the GameMaker runner expects it to exist. -->
    <script type="javascript/worker" id="tick-worker">
      var timer = null;
      onmessage = function (e) {
        var data = e.data || {};
        if (data.run) {
          if (timer === null) {
            timer = setInterval(function () { postMessage({}); }, 1000 / (data.fps || 60));
          }
        } else if (timer !== null) {
          clearInterval(timer);
          timer = null;
        }
      };
    </script>

    <script>
      var USE_CLOCK_FREEZE = true;
      (function () {
        if (!USE_CLOCK_FREEZE) return;
        var realPerfNow = performance.now.bind(performance);
        var realDateNow = Date.now.bind(Date);
        var hiddenPerfAt = null, hiddenDateAt = null;
        var perfOffset = 0, dateOffset = 0;

        performance.now = function () {
          var t = hiddenPerfAt !== null ? hiddenPerfAt : realPerfNow();
          return t - perfOffset;
        };
        Date.now = function () {
          var t = hiddenDateAt !== null ? hiddenDateAt : realDateNow();
          return t - dateOffset;
        };

        var realRAF = window.requestAnimationFrame.bind(window);
        window.requestAnimationFrame = function (cb) {
          return realRAF(function (ts) {

            cb(hiddenPerfAt !== null ? hiddenPerfAt - perfOffset : ts - perfOffset);
          });
        };


        var audioContexts = [];
        try {
          var USE_AUDIO_HOOK = false; 
          var BaseAC = window.AudioContext || window.webkitAudioContext;
          if (BaseAC && USE_AUDIO_HOOK) {
            var TrackedAC = function () {
              var ctx = new (Function.prototype.bind.apply(BaseAC, [null].concat([].slice.call(arguments))))();
              audioContexts.push(ctx);
              return ctx;
            };
            TrackedAC.prototype = BaseAC.prototype;
            window.AudioContext = TrackedAC;
            if (window.webkitAudioContext) window.webkitAudioContext = TrackedAC;
          }
        } catch (e) { console.warn("Audio tracking unavailable:", e); }

        var holds = { hidden: false, menu: false };
        function updateClock() {
          var anyHold = holds.hidden || holds.menu;
          if (anyHold && hiddenPerfAt === null) {
            hiddenPerfAt = realPerfNow();
            hiddenDateAt = realDateNow();
          } else if (!anyHold && hiddenPerfAt !== null) {
            perfOffset += realPerfNow() - hiddenPerfAt;
            dateOffset += realDateNow() - hiddenDateAt;
            hiddenPerfAt = null;
            hiddenDateAt = null;
          }
        }
        window.__clockHold = function (reason, on) {
          holds[reason] = !!on;
          updateClock();
        };

        document.addEventListener("visibilitychange", function () {
          var hidden = document.visibilityState === "hidden";
          window.__clockHold("hidden", hidden);
          audioContexts.forEach(function (c) { try { hidden ? c.suspend() : c.resume(); } catch (e) {} });
        });
      })();
    </script>

    <script>
      var USE_RAF_DEDUPE = true;
      (function () {
        var realRAF = window.requestAnimationFrame.bind(window);
        var realCancel = window.cancelAnimationFrame.bind(window);
        var pendingByCb = new Map();
        var cbById = new Map();
        var stats = { dup: 0, calls: 0, frames: 0, lastTs: -1, killed: 0, cbs: new Set() };
        window.__rafStats = stats;

        var loopCache = new WeakMap();
        function isRunnerLoop(cb) {
          if (typeof cb !== "function") return false;
          var known = loopCache.get(cb);
          if (known !== undefined) return known;
          var result = false;
          try {
            result = Function.prototype.toString.call(cb).indexOf("M(a)(d,b)&&requestAnimationFrame(c)") !== -1;
          } catch (e) {}
          loopCache.set(cb, result);
          return result;
        }

        window.requestAnimationFrame = function (cb) {
          if (USE_RAF_DEDUPE && pendingByCb.has(cb)) {
            stats.dup++;
            return pendingByCb.get(cb);
          }
          if (USE_RAF_DEDUPE && isRunnerLoop(cb)) {
            pendingByCb.forEach(function (otherId, other) {
              if (other !== cb && isRunnerLoop(other)) {
                realCancel(otherId);
                pendingByCb.delete(other);
                cbById.delete(otherId);
                stats.killed++;
              }
            });
          }
          var id = realRAF(function (ts) {
            pendingByCb.delete(cb);
            cbById.delete(id);
            stats.calls++;
            if (ts !== stats.lastTs) { stats.lastTs = ts; stats.frames++; }
            stats.cbs.add(cb);
            cb(ts);
          });
          pendingByCb.set(cb, id);
          cbById.set(id, cb);
          return id;
        };

        window.cancelAnimationFrame = function (id) {
          var cb = cbById.get(id);
          if (cb) { pendingByCb.delete(cb); cbById.delete(id); }
          realCancel(id);
        };
      })();
    </script>

    <script>
      (function () {
        var inVisibilityDispatch = false;
        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState === "visible") {
            inVisibilityDispatch = true;
            setTimeout(function () { inVisibilityDispatch = false; }, 0);
          }
        });

        window.installPauseMenuFix = function () {
          var origPause = window.pause;
          var origResume = window.resume;
          if (typeof origPause !== "function" || typeof origResume !== "function") {
            if (window.dbg) dbg("PAUSE-MENU FIX NOT INSTALLED: pause()/resume() not found");
            return;
          }
          if (window.dbg) dbg("pause-menu fix v2 installed");
          var menuUp = false;

          window.pause = function () {
            if (menuUp) return;
            var result = origPause.apply(this, arguments);
            var menu = document.getElementById("pauseMenuContainer");
            if (menu && !menu.hidden) {
              menuUp = true;
              if (window.__clockHold) window.__clockHold("menu", true);
            }
            return result;
          };

          window.resume = function () {
            if (inVisibilityDispatch) {
              if (window.dbg) dbg("auto-resume skipped (menu stays up)");
              return;
            }
            if (!menuUp) return;
            menuUp = false;
            if (window.__clockHold) window.__clockHold("menu", false);
            return origResume.apply(this, arguments);
          };
        };
      })();
    </script>

    <script>
      function setStatus(text, isError) {
        var el = document.getElementById("status");
        if (!el) return;
        el.textContent = text;
        el.className = "emscripten" + (isError ? " error" : "");
        if (isError) {
          var spinner = document.getElementById("spinner");
          if (spinner) spinner.style.display = "none";
        }
      }

  
      window.addEventListener("error", function (e) {
        console.error("Page error:", e.message || e);
      });
      window.addEventListener("unhandledrejection", function (e) {
        console.error("Unhandled promise rejection:", e.reason);
      });


      var worker = null;
      try {
        var tickEl = document.querySelector("#tick-worker");
        var blob = new Blob([tickEl.textContent], { type: "application/javascript" });
        worker = new Worker(window.URL.createObjectURL(blob));
        worker.onmessage = function () {
          if (typeof GM_tick === "function") GM_tick(performance.now());
        };
      } catch (err) {
        console.warn("Tick worker unavailable (only needed for multiplayer in background tabs):", err);
      }

      function isMultiplayer() {
        if (typeof GM_is_multiplayer !== "function") return false;
        return GM_is_multiplayer() !== 0;
      }

      document.addEventListener("visibilitychange", function () {
        if (!worker || !isMultiplayer()) return;
        if (document.visibilityState === "hidden") {
          worker.postMessage({ run: true, fps: 60 });
        } else {
          worker.postMessage({ run: false });
        }
      });
    </script>

    <script>
      var DEBUG_OVERLAY = false;
      (function () {
        if (!DEBUG_OVERLAY) return;
        var box = document.createElement("div");
        box.style.cssText = "position:fixed;left:4px;bottom:4px;z-index:99999;max-width:92vw;" +
          "background:rgba(0,0,0,.75);color:#0f0;font:11px monospace;padding:4px;" +
          "pointer-events:none;white-space:pre-wrap";
        document.body.appendChild(box);
        var lines = [];
        var statLine = "";
        function render() { box.textContent = statLine + "\n" + lines.join("\n"); }
        window.dbg = function (msg) {
          lines.push((performance.now() / 1000).toFixed(1) + "s  " + msg);
          if (lines.length > 12) lines.shift();
          render();
        };


        var lastCalls = 0, lastFrames = 0, lastReal = Date.now();
        setInterval(function () {
          var s = window.__rafStats;
          if (!s) return;
          var now = Date.now();
          var secs = Math.max(1, now - lastReal) / 1000;
          var cbRate = Math.round((s.calls - lastCalls) / secs);
          var frameRate = Math.round((s.frames - lastFrames) / secs);
          lastCalls = s.calls; lastFrames = s.frames; lastReal = now;
          statLine = "callbacks/s: " + cbRate + "  real frames/s: " + frameRate +
                     "  stale loops killed: " + s.killed + "  dupes blocked: " + s.dup;
          s.cbs.clear();
          render();
        }, 1000);

        var hiddenAt = null;
        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState === "hidden") {
            hiddenAt = performance.now();
            dbg("BEFORE LEAVING: " + statLine);
            dbg("TAB HIDDEN");
          } else {
            var gap = hiddenAt === null ? "?" : ((performance.now() - hiddenAt) / 1000).toFixed(1);
            dbg("TAB VISIBLE (was away " + gap + "s)");
            setTimeout(function () { dbg("3s AFTER RETURN: " + statLine); }, 3000);
          }
        });

        function wrap(name) {
          var f = window[name];
          if (typeof f !== "function" || f.__wrapped) return false;
          var w = function () { dbg(name + "() called"); return f.apply(this, arguments); };
          w.__wrapped = true;
          window[name] = w;
          return true;
        }

        window.startDebugHooks = function () {
          dbg("index.js has gamePaused fix: " + (typeof gamePaused !== "undefined"));
          wrap("pause");
          wrap("resume");
          var tries = 0;
          var timer = setInterval(function () {
            wrap("GM_pause");
            wrap("GM_unpause");
            var found = window.GM_pause && window.GM_pause.__wrapped &&
                        window.GM_unpause && window.GM_unpause.__wrapped;
            if (found) { dbg("hooked GM_pause / GM_unpause"); clearInterval(timer); }
            else if (++tries > 60) { dbg("GM_pause/GM_unpause not found as globals"); clearInterval(timer); }
          }, 500);
        };
      })();
    </script>

    <script>
      function mergeFiles(fileParts) {
        return new Promise(function (resolve, reject) {
          var buffers = [];

          function fetchPart(index) {
            if (index >= fileParts.length) {
              var mergedBlob = new Blob(buffers);
              buffers = null; 
              resolve(URL.createObjectURL(mergedBlob));
              return;
            }

            setStatus("Downloading part " + (index + 1) + " of " + fileParts.length + "...");

            fetch(fileParts[index])
              .then(function (response) {
                if (!response.ok) {
                  throw new Error("HTTP " + response.status + " for " + fileParts[index]);
                }
                return response.arrayBuffer();
              })
              .then(function (data) {
                buffers.push(data);
                fetchPart(index + 1);
              })
              .catch(reject);
          }

          fetchPart(0);
        });
      }

      function getParts(file, start, end) {
        var parts = [];
        for (var i = start; i <= end; i++) {
          parts.push(file + ".part" + i);
        }
        return parts;
      }


      function loadScript(src) {
        return new Promise(function (resolve, reject) {
          var s = document.createElement("script");
          s.src = src;
          s.async = false;
          s.onload = resolve;
          s.onerror = function () { reject(new Error("Failed to load " + src)); };
          document.body.appendChild(s);
        });
      }

      mergeFiles(getParts("game.unx", 1, 5))
        .then(function (url) {
          window.gameUnxUrl = url;
          setStatus("Starting game...");

          var originalFetch = window.fetch;
          window.fetch = function (input, options) {
            var reqUrl = typeof input === "string" ? input : (input && input.url);
            if (reqUrl && reqUrl.includes("game.unx")) {
              console.log("fetch:", reqUrl);
              input = (typeof input === "string") ? window.gameUnxUrl : new Request(window.gameUnxUrl, input);
            }
            return originalFetch.call(this, input, options);
          };

          var originalOpen = XMLHttpRequest.prototype.open;
          XMLHttpRequest.prototype.open = function (method, reqUrl) {
            var rest = Array.prototype.slice.call(arguments, 2);
            if (typeof reqUrl === "string" && reqUrl.includes("game.unx")) {
              console.log("XHR:", reqUrl);
              reqUrl = window.gameUnxUrl;
            }
            return originalOpen.apply(this, [method, reqUrl].concat(rest));
          };

          return loadScript("index.js").then(function () {
            return loadScript("runner.js");
          }).then(function () {
            if (window.installPauseMenuFix) window.installPauseMenuFix();
            if (window.startDebugHooks) window.startDebugHooks();
          });
        })
        .catch(function (error) {
          console.error("Failed to load game:", error);
          setStatus("Error: " + error.message, true);
        });
    </script>
  </body>
</html>
